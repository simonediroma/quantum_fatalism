  - {text: "Non condivisa, genera entropia distribuita nel campo", source: "c5:38", quote: "Una dissoluzione non condivisa genera entropia."}
  - {text: "Come Garbage Collection: libera risorse bloccate", source: "c5:40", quote: "è una funzione di **Garbage Collection**"}
relations:
