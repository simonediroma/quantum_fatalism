id: "epifanie-si-ricevono"
name: "Le epifanie si ricevono, non si generano"
summary: "Le epifanie emergono già formate perché il loro costo è già stato distribuito nel campo."
traits:
  - {text: "Non costano: emergono già formate, già a bassa energia", source: "c4:15", quote: "emergono già formate, già a bassa energia"}
  - {text: "Il singolo non le elabora: le riceve", source: "c4:15", quote: "Il singolo non le elabora: le riceve."}
  - {text: "Il problema non è generarle ma cosa succede dopo", source: "c4:55", quote: "Il problema non è generare epifanie."}
relations:
