id: "decoerenza"
name: "Decoerenza"
summary: "Il decadimento delle coerenze quando il sistema si accoppia a qualcosa che registra quale alternativa è in corso."
traits:
  - {text: "Passaggio dal quadro quantistico a quello classico", source: "c10:20", quote: "il passaggio dall'uno all'altro ha un nome, decoerenza"}
  - {text: "Matrice densità: diagonale = probabilità, fuori diagonale = coerenze", source: "c10:20", quote: "lo stato di un sistema è descritto da una matrice densità"}
  - {text: "La sua necessità rispetto a una descrizione classica non è stabilita", source: "c10:22", quote: "dichiarando che la sua necessità rispetto a una descrizione classica non è stabilita"}
open:
  - {text: "L'evidenza empirica che motiva questa lettura (effetto disgiunzione) è dichiarata contestata su tre fronti (c10)."}
relations:
  - {to: "cognizione-quantistica", type: "usata da", source: "c10:20", quote: "La cognizione quantistica ha costruito modelli di decisione esattamente su questa base"}
